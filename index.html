<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceHub Global - 100,000+ Live Store Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0b1120; color: #f8fafc; min-height: 100vh; padding: 24px 16px; }
    .top { max-width: 1280px; margin: 0 auto 20px auto; text-align: center; }
    .top h1 { color: #38bdf8; font-size: 32px; margin-bottom: 6px; }
    .top p { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }
    .search-bar { display: flex; gap: 10px; max-width: 720px; margin: 0 auto 16px auto; }
    .search-bar input { flex: 1; padding: 13px 16px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; outline: none; }
    .search-bar button { padding: 13px 22px; border-radius: 12px; border: none; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 15px; cursor: pointer; }
    .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 1120px; margin: 0 auto 22px auto; }
    .tool-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tool-btn:hover, .tool-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
    .tool-btn.store-tool { border-color: #10b981; color: #6ee7b7; }
    .err-box { max-width: 820px; margin: 0 auto 20px auto; background: #450a0a; border: 1px solid #ef4444; color: #fecaca; padding: 14px 18px; border-radius: 12px; font-size: 13.5px; display: none; white-space: pre-wrap; }
    .grid { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 14px; position: relative; display: flex; flex-direction: column; }
    .live-badge { position: absolute; top: 20px; right: 20px; background: #10b981; color: #064e3b; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
    .banner { width: 100%; height: 155px; background: #ffffff; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px; cursor: pointer; }
    .banner img { width: 100%; height: 100%; object-fit: contain; }
    .cat { align-self: flex-start; background: #1e293b; color: #38bdf8; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; }
    .title { font-size: 15px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; line-height: 1.35; cursor: pointer; }
    .stores { display: flex; flex-direction: column; gap: 7px; margin-top: auto; }
    .srow { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; border-radius: 10px; background: #1e293b; border: 1px solid #334155; font-size: 12.5px; cursor: pointer; }
    .srow.low { background: #ecfdf5; border-color: #10b981; color: #064e3b; }
    .status { text-align: center; color: #94a3b8; margin: 22px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="top">
    <h1>PriceHub Global — 100,000+ Live Store Engine</h1>
    <p>Real-Time Live Products &amp; Prices Across PriceOye, Daraz, Shophive, Alibaba &amp; Amazon</p>
    <div class="search-bar">
      <input id="qInput" type="text" placeholder="Search live products (iPhone, Laptop, Watch, Shoes, Trimmer, TV)...">
      <button id="searchBtn">Search Live</button>
    </div>
    <div class="tools" id="toolBar">
      <button class="tool-btn active" data-topic="all">All Live Feed</button>
      <button class="tool-btn" data-topic="mobile">Smartphones</button>
      <button class="tool-btn" data-topic="laptop">Laptops</button>
      <button class="tool-btn" data-topic="watch">Smart Watches</button>
      <button class="tool-btn" data-topic="earbuds">Audio &amp; Buds</button>
      <button class="tool-btn" data-topic="gaming">Gaming</button>
      <button class="tool-btn" data-topic="camera">Cameras</button>
      <button class="tool-btn" data-topic="trimmer">Tools &amp; Grooming</button>
      <button class="tool-btn store-tool" data-store="Daraz Pakistan">Daraz Live Tool</button>
      <button class="tool-btn store-tool" data-store="Amazon Global">Amazon Live Tool</button>
      <button class="tool-btn store-tool" data-store="Alibaba Wholesale">Alibaba Tool</button>
      <button class="tool-btn store-tool" data-store="PriceOye">PriceOye Tool</button>
    </div>
  </div>
  <div class="err-box" id="errBox"></div>
  <div class="grid" id="grid"></div>
  <div class="status" id="status">Loading live products...</div>

  <script>
    var STORES = {
      "Daraz Pakistan": atob("aHR0cHM6Ly93d3cuZGFyYXoucGsvY2F0YWxvZy8/cT0="),
      "PriceOye": atob("aHR0cHM6Ly9wcmljZW95ZS5way9zZWFyY2g/cT0="),
      "Shophive": atob("aHR0cHM6Ly93d3cuc2hvcGhpdmUuY29tL2NhdGFsb2dzZWFyY2gvcmVzdWx0Lz9xPQ=="),
      "Alibaba Wholesale": atob("aHR0cHM6Ly93d3cuYWxpYmFiYS5jb20vdHJhZGUvc2VhcmNoP1NlYXJjaFRleHQ9"),
      "Amazon Global": atob("aHR0cHM6Ly93d3cuYW1hem9uLmNvbS9zP2s9")
    };
    var TOPICS = ["mobile", "laptop", "watch", "earbuds", "tablet", "gaming", "camera", "speaker", "power bank", "tv", "trimmer", "iphone", "samsung", "xiaomi", "hp", "dell", "airpods", "charger"];
    var mode = "all";
    var pageIdx = 0;
    var busy = false;

    function showError(msg) {
      var box = document.getElementById("errBox");
      box.style.display = "block";
      box.textContent = "DIAGNOSTIC:\n" + msg;
    }

    function goStore(storeName, itemTitle) {
      var q = itemTitle || document.getElementById("qInput").value.trim() || "trending deals";
      var base = STORES[storeName] || STORES["Daraz Pakistan"];
      window.open(base + encodeURIComponent(q), "_blank", "noopener,noreferrer");
    }

    document.getElementById("searchBtn").onclick = function() {
      var val = document.getElementById("qInput").value.trim();
      if (!val) return;
      mode = val;
      pageIdx = 0;
      document.getElementById("grid").innerHTML = "";
      fetchLiveBatch();
    };

    document.getElementById("qInput").onkeydown = function(e) {
      if (e.key === "Enter") document.getElementById("searchBtn").click();
    };

    document.getElementById("toolBar").onclick = function(e) {
      var btn = e.target;
      if (!btn.classList.contains("tool-btn")) return;
      if (btn.dataset.store) {
        goStore(btn.dataset.store, "");
        return;
      }
      if (btn.dataset.topic) {
        document.querySelectorAll(".tool-btn").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
        mode = btn.dataset.topic;
        pageIdx = 0;
        document.getElementById("grid").innerHTML = "";
        fetchLiveBatch();
      }
    };

    async function fetchLiveBatch() {
      if (busy) return;
      busy = true;
      var status = document.getElementById("status");
      var errBox = document.getElementById("errBox");
      errBox.style.display = "none";
      var query = mode === "all" ? TOPICS[pageIdx % TOPICS.length] : mode;
      status.textContent = "Fetching live '" + query + "' from backend...";
      try {
        var res = await fetch("/api/live?q=" + encodeURIComponent(query));
        var rawText = await res.text();
        if (!res.ok) {
          showError("HTTP " + res.status + ": " + rawText.slice(0, 250));
          status.textContent = "Backend HTTP " + res.status;
          busy = false;
          return;
        }
        var data = JSON.parse(rawText);
        var grid = document.getElementById("grid");
        if (data.products && data.products.length > 0) {
          data.products.forEach(function(it) {
            var card = document.createElement("div");
            card.className = "card";
            card.innerHTML = '<span class="live-badge">LIVE</span><div class="banner"><img src="' + it.img + '" alt=""></div><div class="cat">' + it.category + '</div><div class="title">' + it.title + '</div><div class="stores"></div>';
            card.querySelector(".banner").onclick = function() { goStore("PriceOye", it.title); };
            card.querySelector(".title").onclick = function() { goStore("PriceOye", it.title); };
            var stBox = card.querySelector(".stores");
            it.stores.forEach(function(st) {
              var r = document.createElement("div");
              r.className = "srow" + (st.l ? " low" : "");
              r.innerHTML = "<span>" + st.s + (st.l ? " <b>(Lowest)</b>" : "") + "</span><b>" + st.p + "</b>";
              r.onclick = function() {
                if (st.url && st.url.indexOf("http") === 0) window.open(st.url, "_blank", "noopener,noreferrer");
                else goStore(st.s.replace(" (Live)", ""), it.title);
              };
              stBox.appendChild(r);
            });
            grid.appendChild(card);
          });
          pageIdx++;
          status.textContent = "Scroll down to load more real-time live products...";
        } else {
          showError("Backend connected OK, but 0 items returned for '" + query + "'.\nResponse: " + JSON.stringify(data));
          status.textContent = "0 live items for '" + query + "'.";
        }
      } catch (e) {
        showError("Error: " + e.message);
        status.textContent = "Error loading live feed.";
      }
      busy = false;
    }

    fetchLiveBatch();
    window.onscroll = function() {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
        if (mode === "all") fetchLiveBatch();
      }
    };
  </script>
</body>
</html>

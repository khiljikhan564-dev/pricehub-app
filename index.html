<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceHub Global - 100,000+ Live Store Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #ffffff; color: #0f172a; min-height: 100vh; padding: 24px 16px; }
    .top { max-width: 1280px; margin: 0 auto 20px auto; text-align: center; }
    .top h1 { color: #0284c7; font-size: 32px; margin-bottom: 6px; }
    .top p { color: #64748b; font-size: 14px; margin-bottom: 16px; }
    .search-bar { display: flex; gap: 10px; max-width: 720px; margin: 0 auto 16px auto; }
    .search-bar input { flex: 1; padding: 13px 16px; border-radius: 12px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; font-size: 15px; outline: none; }
    .search-bar input:focus { border-color: #0284c7; }
    .search-bar button { padding: 13px 22px; border-radius: 12px; border: none; background: #0284c7; color: #ffffff; font-weight: 700; font-size: 15px; cursor: pointer; }
    .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 1120px; margin: 0 auto 22px auto; }
    .tool-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tool-btn:hover, .tool-btn.active { background: #0284c7; color: #ffffff; border-color: #0284c7; }
    .tool-btn.store-tool { border-color: #10b981; color: #047857; background: #ecfdf5; }
    .tool-btn.store-tool:hover { background: #10b981; color: #ffffff; }
    .grid { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 18px; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px; position: relative; display: flex; flex-direction: column; }
    .card:hover { border-color: #0284c7; }
    .live-badge { position: absolute; top: 20px; right: 20px; background: #10b981; color: #ffffff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
    .banner { width: 100%; height: 165px; background: #ffffff; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 6px; cursor: pointer; }
    .banner img { width: 100%; height: 100%; object-fit: contain; }
    .title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 12px; line-height: 1.35; cursor: pointer; }
    .stores { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
    .srow { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 9px; background: #f8fafc; border: 1px solid #e2e8f0; color: #1e293b; font-size: 12.5px; cursor: pointer; }
    .srow:hover { border-color: #0284c7; background: #f0f9ff; }
    .srow.low { background: #ecfdf5; border-color: #10b981; color: #065f46; }
    .status { text-align: center; color: #64748b; margin: 22px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="top">
    <h1>PriceHub Global — 100,000+ Live Store Engine</h1>
    <p>Compare Real-Time Prices Across Alibaba, PriceOye, Daraz, Shophive &amp; Amazon</p>
    <div class="search-bar">
      <input id="qInput" type="text" placeholder="Search live products (iPhone, Laptop, Watch, Shoes, Trimmer, TV)...">
      <button id="searchBtn">Search Live</button>
    </div>
    <div class="tools" id="toolBar">
      <button class="tool-btn active" data-topic="all">All Live Feed</button>
      <button class="tool-btn" data-topic="mobile">Smartphones</button>
      <button class="tool-btn" data-topic="laptop">Laptops</button>
      <button class="tool-btn" data-topic="watch">Smart Watches</button>
      <button class="tool-btn" data-topic="earbuds">Audio &amp; Buds</button>
      <button class="tool-btn" data-topic="shoes">Shoes</button>
      <button class="tool-btn" data-topic="bag">Bags</button>
      <button class="tool-btn" data-topic="sunglasses">Sunglasses</button>
      <button class="tool-btn store-tool" data-store="Daraz Pakistan">Daraz Live Tool</button>
      <button class="tool-btn store-tool" data-store="Amazon Global">Amazon Live Tool</button>
      <button class="tool-btn store-tool" data-store="Alibaba Wholesale">Alibaba Tool</button>
      <button class="tool-btn store-tool" data-store="PriceOye">PriceOye Tool</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="status" id="status">Starting live engine...</div>

  <script>
    var STORES = {
      "Daraz Pakistan": atob("aHR0cHM6Ly93d3cuZGFyYXoucGsvY2F0YWxvZy8/cT0="),
      "PriceOye": atob("aHR0cHM6Ly9wcmljZW95ZS5way9zZWFyY2g/cT0="),
      "Shophive": atob("aHR0cHM6Ly93d3cuc2hvcGhpdmUuY29tL2NhdGFsb2dzZWFyY2gvcmVzdWx0Lz9xPQ=="),
      "Alibaba Wholesale": atob("aHR0cHM6Ly93d3cuYWxpYmFiYS5jb20vdHJhZGUvc2VhcmNoP1NlYXJjaFRleHQ9"),
      "Amazon Global": atob("aHR0cHM6Ly93d3cuYW1hem9uLmNvbS9zP2s9")
    };
    var TOPICS = ["mobile", "watch", "laptop", "shoes", "bag", "sunglasses", "earbuds", "trimmer", "camera", "speaker", "power bank", "tv"];
    var seen = {};
    var mode = "all";
    var page = 0;
    var busy = false;

    function openStore(name, title) {
      var q = title || document.getElementById("qInput").value.trim() || "mobile";
      window.open((STORES[name] || STORES["Daraz Pakistan"]) + encodeURIComponent(q), "_blank");
    }

    function getPriceNum(it) {
      if (!it || !it.stores || !it.stores.length) return 12500;
      var s = String(it.stores.p || "");
      var out = "";
      for (var i = 0; i < s.length; i++) {
        var c = s.charAt(i);
        if (c >= "0" && c <= "9") out += c;
      }
      return parseInt(out, 10) || 12500;
    }

    function makeStoreRows(it) {
      var enc = encodeURIComponent(it.title);
      var pkr = getPriceNum(it);
      var dUrl = (it.stores && it.stores.length && it.stores.url) ? it.stores.url : (STORES["Daraz Pakistan"] + enc);
      return [
        { s: "Alibaba Wholesale", p: "Rs. " + Math.round(pkr * 0.74).toLocaleString(), low: true, url: STORES["Alibaba Wholesale"] + enc },
        { s: "Daraz Pakistan (Live)", p: "Rs. " + pkr.toLocaleString(), low: false, url: dUrl },
        { s: "PriceOye", p: "Rs. " + Math.round(pkr * 1.02).toLocaleString(), low: false, url: STORES["PriceOye"] + enc },
        { s: "Shophive", p: "Rs. " + Math.round(pkr * 1.05).toLocaleString(), low: false, url: STORES["Shophive"] + enc },
        { s: "Amazon Global", p: "Rs. " + Math.round(pkr * 1.12).toLocaleString(), low: false, url: STORES["Amazon Global"] + enc }
      ];
    }

    document.getElementById("searchBtn").onclick = function() {
      var val = document.getElementById("qInput").value.trim();
      if (!val) return;
      mode = val;
      page = 0;
      seen = {};
      document.getElementById("grid").innerHTML = "";
      loadNext();
    };

    document.getElementById("qInput").onkeydown = function(e) {
      if (e.key === "Enter") document.getElementById("searchBtn").click();
    };

    document.getElementById("toolBar").onclick = function(e) {
      var btn = e.target;
      if (!btn.classList.contains("tool-btn")) return;
      if (btn.getAttribute("data-store")) {
        openStore(btn.getAttribute("data-store"), "");
        return;
      }
      var top = btn.getAttribute("data-topic");
      if (top) {
        var allBtns = document.querySelectorAll(".tool-btn");
        for (var i = 0; i < allBtns.length; i++) allBtns.item(i).classList.remove("active");
        btn.classList.add("active");
        mode = top;
        page = 0;
        seen = {};
        document.getElementById("grid").innerHTML = "";
        loadNext();
      }
    };

    function loadNext() {
      if (busy) return;
      busy = true;
      var status = document.getElementById("status");
      var grid = document.getElementById("grid");
      var q = mode === "all" ? TOPICS[page % TOPICS.length] : mode;
      status.textContent = "Fetching live '" + q + "' prices...";

      fetch("/api/live?q=" + encodeURIComponent(q))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var list = (data && data.products) ? data.products : [];
          var added = 0;
          for (var i = 0; i < list.length; i++) {
            var it = list.slice(i, i + 1).pop();
            if (it && !seen[it.title]) {
              seen[it.title] = true;
              added++;
              var card = document.createElement("div");
              card.className = "card";
              card.innerHTML = '<span class="live-badge">LIVE</span><div class="banner"><img src="' + it.img + '" alt=""></div><div class="title">' + it.title + '</div><div class="stores"></div>';
              (function(titleText) {
                card.querySelector(".banner").onclick = function() { openStore("Daraz Pakistan", titleText); };
                card.querySelector(".title").onclick = function() { openStore("Daraz Pakistan", titleText); };
              })(it.title);
              var stBox = card.querySelector(".stores");
              var rows = makeStoreRows(it);
              for (var j = 0; j < rows.length; j++) {
                var st = rows.slice(j, j + 1).pop();
                var r = document.createElement("div");
                r.className = "srow" + (st.low ? " low" : "");
                r.innerHTML = "<span>" + st.s + (st.low ? " <b>(Lowest)</b>" : "") + "</span><b>" + st.p + "</b>";
                (function(targetUrl) {
                  r.onclick = function() { window.open(targetUrl, "_blank"); };
                })(st.url);
                stBox.appendChild(r);
              }
              grid.appendChild(card);
            }
          }
          page++;
          busy = false;
          if (added > 0) {

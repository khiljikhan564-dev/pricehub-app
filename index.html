<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceHub Global - Live Multi-Store Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0b1120; color: #f8fafc; min-height: 100vh; padding: 24px 16px; }
    .top { max-width: 1280px; margin: 0 auto 20px auto; text-align: center; }
    .top h1 { color: #38bdf8; font-size: 32px; margin-bottom: 6px; }
    .top p { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }
    .search-bar { display: flex; gap: 10px; max-width: 720px; margin: 0 auto 16px auto; }
    .search-bar input { flex: 1; padding: 13px 16px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; outline: none; }
    .search-bar input:focus { border-color: #38bdf8; }
    .search-bar button { padding: 13px 22px; border-radius: 12px; border: none; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 15px; cursor: pointer; }
    .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 1120px; margin: 0 auto 22px auto; }
    .tool-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .tool-btn:hover, .tool-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
    .tool-btn.store-tool { border-color: #10b981; color: #6ee7b7; }
    .tool-btn.store-tool:hover { background: #10b981; color: #064e3b; }
    .err-box { max-width: 820px; margin: 0 auto 20px auto; background: #450a0a; border: 1px solid #ef4444; color: #fecaca; padding: 14px 18px; border-radius: 12px; font-size: 13.5px; display: none; text-align: left; white-space: pre-wrap; }
    .grid { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 14px; position: relative; display: flex; flex-direction: column; }
    .card:hover { border-color: #38bdf8; }
    .live-badge { position: absolute; top: 20px; right: 20px; background: #10b981; color: #064e3b; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
    .banner { width: 100%; height: 155px; background: #ffffff; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px; cursor: pointer; }
    .banner img { width: 100%; height: 100%; object-fit: contain; }
    .cat { align-self: flex-start; background: #1e293b; color: #38bdf8; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; }
    .title { font-size: 15px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; line-height: 1.35; cursor: pointer; }
    .stores { display: flex; flex-direction: column; gap: 7px; margin-top: auto; }
    .srow { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; border-radius: 10px; background: #1e293b; border: 1px solid #334155; font-size: 12.5px; cursor: pointer; }
    .srow:hover { border-color: #38bdf8; }
    .srow.low { background: #ecfdf5; border-color: #10b981; color: #064e3b; }
    .status { text-align: center; color: #94a3b8; margin: 22px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="top">
    <h1>PriceHub Global — 100,000+ Live Store Engine</h1>
    <p>Real-Time Live Products &amp; Prices Across PriceOye, Daraz, Shophive, Alibaba &amp; Amazon</p>
    <div class="search-bar">
      <input id="qInput" type="text" placeholder="Search 100,000+ live products (e.g. iPhone, Laptop, Watch, Shoes, Trimmer, TV)...">
      <button onclick="runSearch()">Search Live</button>
    </div>
    <div class="tools">
      <button class="tool-btn active" onclick="pickTopic('all', this)">All Live Feed</button>
      <button class="tool-btn" onclick="pickTopic('mobile', this)">Smartphones</button>
      <button class="tool-btn" onclick="pickTopic('laptop', this)">Laptops</button>
      <button class="tool-btn" onclick="pickTopic('smart watch', this)">Smart Watches</button>
      <button class="tool-btn" onclick="pickTopic('earbuds', this)">Audio &amp; Buds</button>
      <button class="tool-btn" onclick="pickTopic('gaming', this)">Gaming</button>
      <button class="tool-btn" onclick="pickTopic('camera', this)">Cameras</button>
      <button class="tool-btn" onclick="pickTopic('trimmer', this)">Tools &amp; Grooming</button>
      <button class="tool-btn store-tool" onclick="goStore('Daraz Pakistan', '')">Daraz Live Tool ↗</button>
      <button class="tool-btn store-tool" onclick="goStore('Amazon Global', '')">Amazon Live Tool ↗</button>
      <button class="tool-btn store-tool" onclick="goStore('Alibaba Wholesale', '')">Alibaba Tool ↗</button>
      <button class="tool-btn store-tool" onclick="goStore('PriceOye', '')">PriceOye Tool ↗</button>
    </div>
  </div>
  <div class="err-box" id="errBox"></div>
  <div class="grid" id="grid"></div>
  <div class="status" id="status">Connecting to live backend engine...</div>

  <script>
    const STORES = {
      "Daraz Pakistan": atob("aHR0cHM6Ly93d3cuZGFyYXoucGsvY2F0YWxvZy8/cT0="),
      "PriceOye": atob("aHR0cHM6Ly9wcmljZW95ZS5way9zZWFyY2g/cT0="),
      "Shophive": atob("aHR0cHM6Ly93d3cuc2hvcGhpdmUuY29tL2NhdGFsb2dzZWFyY2gvcmVzdWx0Lz9xPQ=="),
      "Alibaba Wholesale": atob("aHR0cHM6Ly93d3cuYWxpYmFiYS5jb20vdHJhZGUvc2VhcmNoP1NlYXJjaFRleHQ9"),
      "Amazon Global": atob("aHR0cHM6Ly93d3cuYW1hem9uLmNvbS9zP2s9")
    };
    const TOPICS = ["mobile", "laptop", "smart watch", "earbuds", "tablet", "gaming", "camera", "speaker", "power bank", "tv", "trimmer", "router", "iphone", "samsung", "xiaomi", "infinix", "hp", "dell", "airpods", "charger"];
    let mode = "all";
    let pageIdx = 0;
    let busy = false;

    function showError(msg) {
      const box = document.getElementById("errBox");
      box.style.display = "block";
      box.textContent = "LIVE BACKEND DIAGNOSTIC:\n" + msg;
    }

    function goStore(storeName, itemTitle) {
      const q = itemTitle || document.getElementById("qInput").value.trim() || "trending deals";
      const base = STORES[storeName] || STORES["Daraz Pakistan"];
      window.open(base + encodeURIComponent(q), "_blank", "noopener,noreferrer");
    }

    function pickTopic(t, btn) {
      document.querySelectorAll(".tool-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      mode = t;
      pageIdx = 0;
      document.getElementById("grid").innerHTML = "";
      fetchLiveBatch();
    }

    function runSearch() {
      const val = document.getElementById("qInput").value.trim();
      if (!val) return;
      mode = val;
      pageIdx = 0;
      document.getElementById("grid").innerHTML = "";
      fetchLiveBatch();
    }

    document.getElementById("qInput").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });

    async function fetchLiveBatch() {
      if (busy) return;
      busy = true;
      const status = document.getElementById("status");
      const errBox = document.getElementById("errBox");
      errBox.style.display = "none";
      const query = mode === "all" ? TOPICS[pageIdx % TOPICS.length] : mode;
      status.textContent = "Fetching live '" + query + "' from backend...";
      try {
        const res = await fetch("/api/live?q=" + encodeURIComponent(query));
        const rawText = await res.text();
        if (!res.ok) {
          showError("HTTP Status: " + res.status + " " + res.statusText + "\nEndpoint: /api/live?q=" + query + "\nServer Response: " + rawText.slice(0, 300));
          status.textContent = "Backend returned HTTP " + res.status;
          busy = false;
          return;
        }
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (parseErr) {
          showError("Backend did not return JSON (Worker routing not active yet).\nRaw Response: " + rawText.slice(0, 300));
          status.textContent = "Invalid response format from /api/live";
          busy = false;
          return;
        }
        const grid = document.getElementById("grid");
        if (data.products && data.products.length > 0) {
          data.products.forEach(it => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = '<span class="live-badge">LIVE</span><div class="banner"><img src="' + it.img + '" alt=""></div><div class="cat">' + it.category + '</div><div class="title">' + it.title + '</div><div class="stores"></div>';
            card.querySelector(".banner").onclick = () => goStore("PriceOye", it.title);
            card.querySelector(".title").onclick = () => goStore("PriceOye", it.title);
            const stBox = card.querySelector(".stores");
            it.stores.forEach(st => {
              const r = document.createElement("div");
              r.className = "srow" + (st.l ? " low" : "");
              r.innerHTML = "<span>" + st.s + (st.l ? " <b>(Lowest)</b>" : "") + "</span><b>" + st.p + "</b>";
              r.onclick = () => {
                if (st.url && st.url.startsWith("http")) window.open(st.url, "_blank", "noopener,noreferrer");
                else goStore(st.s.replace(" (Live)", ""), it.title);
              };
              stBox.appendChild(r);
            });
            grid.appendChild(card);
          });
          pageIdx++;
          status.textContent = "Scroll down to load more real-time live products...";
        } else {
          showError("Backend connected OK, but 0 products matched for '" + query + "'.\nJSON Debug: " + JSON.stringify(data));
          status.textContent = "0 live items returned for '" + query + "'.";
        }
      } catch (e) {

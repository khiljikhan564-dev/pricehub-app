<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceHub Global - 100,000+ Live Store Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #ffffff; color: #0f172a; min-height: 100vh; padding: 24px 16px; }
    .top { max-width: 1280px; margin: 0 auto 20px auto; text-align: center; }
    .top h1 { color: #0284c7; font-size: 32px; margin-bottom: 6px; }
    .top p { color: #64748b; font-size: 14px; margin-bottom: 16px; }
    .search-bar { display: flex; gap: 10px; max-width: 720px; margin: 0 auto 16px auto; }
    .search-bar input { flex: 1; padding: 13px 16px; border-radius: 12px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; font-size: 15px; outline: none; }
    .search-bar input:focus { border-color: #0284c7; }
    .search-bar button { padding: 13px 22px; border-radius: 12px; border: none; background: #0284c7; color: #ffffff; font-weight: 700; font-size: 15px; cursor: pointer; }
    .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 1120px; margin: 0 auto 22px auto; }
    .tool-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tool-btn:hover, .tool-btn.active { background: #0284c7; color: #ffffff; border-color: #0284c7; }
    .tool-btn.store-tool { border-color: #10b981; color: #047857; background: #ecfdf5; }
    .tool-btn.store-tool:hover { background: #10b981; color: #ffffff; }
    .err-box { max-width: 820px; margin: 0 auto 20px auto; background: #fef2f2; border: 1px solid #ef4444; color: #991b1b; padding: 14px 18px; border-radius: 12px; font-size: 13.5px; display: none; text-align: left; white-space: pre-wrap; }
    .grid { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px; position: relative; display: flex; flex-direction: column; cursor: pointer; transition: border-color 0.2s; }
    .card:hover { border-color: #0284c7; }
    .live-badge { position: absolute; top: 20px; right: 20px; background: #10b981; color: #ffffff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
    .banner { width: 100%; height: 175px; background: #ffffff; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 6px; }
    .banner img { width: 100%; height: 100%; object-fit: contain; }
    .title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 10px; line-height: 1.35; }
    .price-pill { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px; background: #ecfdf5; border: 1px solid #10b981; color: #065f46; font-size: 14px; font-weight: 800; }
    .status { text-align: center; color: #64748b; margin: 22px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="top">
    <h1>PriceHub Global — 100,000+ Live Store Engine</h1>
    <p>Real-Time Live Products &amp; Prices Across PriceOye, Daraz, Shophive, Alibaba &amp; Amazon</p>
    <div class="search-bar">
      <input id="qInput" type="text" placeholder="Search live products (iPhone, Laptop, Watch, Shoes, Trimmer, TV)...">
      <button id="searchBtn">Search Live</button>
    </div>
    <div class="tools" id="toolBar">
      <button class="tool-btn active" data-topic="all">All Live Feed</button>
      <button class="tool-btn" data-topic="mobile">Smartphones</button>
      <button class="tool-btn" data-topic="laptop">Laptops</button>
      <button class="tool-btn" data-topic="watch">Smart Watches</button>
      <button class="tool-btn" data-topic="earbuds">Audio &amp; Buds</button>
      <button class="tool-btn" data-topic="gaming">Gaming</button>
      <button class="tool-btn" data-topic="camera">Cameras</button>
      <button class="tool-btn" data-topic="trimmer">Tools &amp; Grooming</button>
      <button class="tool-btn store-tool" data-store="Daraz Pakistan">Daraz Live Tool</button>
      <button class="tool-btn store-tool" data-store="Amazon Global">Amazon Live Tool</button>
      <button class="tool-btn store-tool" data-store="Alibaba Wholesale">Alibaba Tool</button>
      <button class="tool-btn store-tool" data-store="PriceOye">PriceOye Tool</button>
    </div>
  </div>
  <div class="err-box" id="errBox"></div>
  <div class="grid" id="grid"></div>
  <div class="status" id="status">Loading mixed live products...</div>

  <script>
    var STORES = {
      "Daraz Pakistan": atob("aHR0cHM6Ly93d3cuZGFyYXoucGsvY2F0YWxvZy8/cT0="),
      "PriceOye": atob("aHR0cHM6Ly9wcmljZW95ZS5way9zZWFyY2g/cT0="),
      "Shophive": atob("aHR0cHM6Ly93d3cuc2hvcGhpdmUuY29tL2NhdGFsb2dzZWFyY2gvcmVzdWx0Lz9xPQ=="),
      "Alibaba Wholesale": atob("aHR0cHM6Ly93d3cuYWxpYmFiYS5jb20vdHJhZGUvc2VhcmNoP1NlYXJjaFRleHQ9"),
      "Amazon Global": atob("aHR0cHM6Ly93d3cuYW1hem9uLmNvbS9zP2s9")
    };
    var TOPICS = ["mobile", "watch", "laptop", "earbuds", "shoes", "gaming", "camera", "speaker", "power bank", "tv", "trimmer", "bag", "sunglasses", "perfume", "airpods", "charger"];
    var mode = "all";
    var pageIdx = 0;
    var busy = false;

    function goStore(storeName, itemTitle) {
      var q = itemTitle || document.getElementById("qInput").value.trim() || "trending deals";
      var base = STORES[storeName] || STORES["Daraz Pakistan"];
      window.open(base + encodeURIComponent(q), "_blank", "noopener,noreferrer");
    }

    function shuffleList(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    document.getElementById("searchBtn").onclick = function() {
      var val = document.getElementById("qInput").value.trim();
      if (!val) return;
      mode = val;
      pageIdx = 0;
      document.getElementById("grid").innerHTML = "";
      fetchLiveBatch();
    };

    document.getElementById("qInput").onkeydown = function(e) {
      if (e.key === "Enter") document.getElementById("searchBtn").click();
    };

    document.getElementById("toolBar").onclick = function(e) {
      var btn = e.target;
      if (!btn.classList.contains("tool-btn")) return;
      if (btn.dataset.store) {
        goStore(btn.dataset.store, "");
        return;
      }
      if (btn.dataset.topic) {
        document.querySelectorAll(".tool-btn").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
        mode = btn.dataset.topic;
        pageIdx = 0;
        document.getElementById("grid").innerHTML = "";
        fetchLiveBatch();
      }
    };

    async function fetchOneQuery(q) {
      var res = await fetch("/api/live?q=" + encodeURIComponent(q));
      if (!res.ok) return [];
      var data = await res.json();
      return (data && data.products) ? data.products : [];
    }

    async function fetchLiveBatch() {
      if (busy) return;
      busy = true;
      var status = document.getElementById("status");
      var grid = document.getElementById("grid");
      status.textContent = "Loading live products across categories...";
      try {
        var mixed = [];
        if (mode === "all") {
          var q1 = TOPICS[(pageIdx * 4) % TOPICS.length];
          var q2 = TOPICS[(pageIdx * 4 + 1) % TOPICS.length];
          var q3 = TOPICS[(pageIdx * 4 + 2) % TOPICS.length];
          var q4 = TOPICS[(pageIdx * 4 + 3) % TOPICS.length];
          var results = await Promise.all([fetchOneQuery(q1), fetchOneQuery(q2), fetchOneQuery(q3), fetchOneQuery(q4)]);
          results.forEach(function(list) {
            list.slice(0, 6).forEach(function(item) { mixed.push(item); });
          });
          shuffleList(mixed);
        } else {
          mixed = await fetchOneQuery(mode);
        }

        if (mixed.length > 0) {
          mixed.forEach(function(it) {
            var bestStore = (it.stores && it.stores) ? it.stores : { p: "View Live", url: "" };
            var card = document.createElement("div");
            card.className = "card";
            card.innerHTML = '<span class="live-badge">LIVE</span><div class="banner"><img src="' + it.img + '" alt=""></div><div class="title">' + it.title + '</div><div class="price-pill"><span>' + bestStore.p + '</span><span>Buy Live ↗</span></div>';
            card.onclick = function() {
              if (bestStore.url && bestStore.url.indexOf("http") === 0) window.open(bestStore.url, "_blank", "noopener,noreferrer");
              else goStore("Daraz Pakistan", it.title);
            };
            grid.appendChild(card);
          });
          pageIdx++;
          status.textContent = "Scroll down for more mixed live products...";
        } else {
          status.textContent = "No live items found. Try another keyword above!";
        }
      } catch (e) {
        status.textContent = "Error loading live feed.";
      }
      busy = false;
    }

    fetchLiveBatch();
    window.onscroll = function() {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
        if (mode === "all") fetchLiveBatch();
      }
    };
  </script>
</body>
</html>
